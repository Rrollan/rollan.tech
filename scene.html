<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#393d34" />
  <title>Остановка Роллана — rollan.tech</title>
  <meta name="description" content="Тихий вечер на остановке. Сайты, игры и хорошие знакомства — Роллан Рогожин." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Caveat:wght@500;700&family=Russo+One&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <main id="experience" data-mode="loading">
    <canvas id="world" tabindex="0" aria-label="Остановка от первого лица. Потяни изображение, чтобы осмотреться. WASD — ходить, стрелки — идти и поворачиваться. Нажми на листовку, чтобы подойти и прочитать. На телефоне коснись пола, чтобы подойти."></canvas>
    <div class="atmosphere" aria-hidden="true"></div>
    <p id="guide" class="guide" hidden>Потяни — оглядеться <span>·</span> Нажми на пол — подойти <span>·</span> На листок — прочитать</p>
    <nav class="keyboard-links" id="keyboardLinks" aria-label="Прочитать объявления с клавиатуры"></nav>
    <div id="touchMove" class="touch-move" hidden aria-hidden="true"><span id="touchMoveKnob"></span></div>
    <div id="loader" class="loader" role="status">
      <span class="loader-sign">А</span><h1>Центральная.</h1>
      <p>Тихий вечер. Хорошие знакомства.</p>
      <div class="load-track"><span id="loadProgress"></span></div>
      <a href="/">Открыть простую версию</a>
    </div>
    <div id="error" class="error" hidden><h2>Остановка пока не загрузилась</h2><p>Попробуй обновить страницу или открой простую версию.</p><a href="/">Перейти к объявлениям ↗</a></div>
  </main>
  <dialog id="paperDialog" class="paper-dialog" aria-labelledby="sheetTitle">
    <button class="close-paper" aria-label="Вернуться к остановке">×</button>
    <div id="paperContent"></div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
